    href: https://github.com/dotnetCollective/dotnetBlocks/blob/861b63c986923085177f2ab5bc993b426e7aa43e/src/dotNetBlocks.System.Threading/CancellationTokenExtensions.cs
  assemblies:
  - dotNetBlocks.System.Threading
  namespace: System.Threading
  summary: >-
    Adds functionality to cancelation tokens.

    Specifically helps for scenarios where you have the token but may not have access to the source.
  remarks: >-
    Cancelation functions can either access the internal token source or use an intermediate source. Common practice uses a temporary linked <xref href="System.Threading.CancellationTokenSource" data-throw-if-not-resolved="false"></xref>. We use that method here.

    LLots of these methods only work because         disposing a token source doesn't break the token.
