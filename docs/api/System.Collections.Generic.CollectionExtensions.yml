  - dotNetBlocks.System.Collections
  namespace: System.Collections.Generic
  summary: Throws a custom exception if the <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> has no items."/&gt; otherwise returns the items.
  remarks: >-
    Useful to ensure that a items has at least one item before proceeding. without materializing the enumeration. Cheaper than the Linq Any() method.

    Manages the enumerator directly for efficiency and to avoid multiple enumeration of the items.
  example: []
  syntax:
    content: public static IEnumerable<TItem> MustHaveOneOrMore<TItem>(this IEnumerable<TItem> items, Func<Exception>? exceptionFactory = null)
    parameters:
    - id: items
      type: System.Collections.Generic.IEnumerable{{TItem}}
      description: The items.
    - id: exceptionFactory
      type: System.Func{System.Exception}
      description: called to create the exception thrown if there are no items in the enumerator.
    typeParameters:
    - id: TItem
      description: The type of the item.
    return:
      type: System.Collections.Generic.IEnumerable{{TItem}}
      description: IEnumerable&lt;TItem&gt; of one or more items
    content.vb: Public Shared Function MustHaveOneOrMore(Of TItem)(items As IEnumerable(Of TItem), exceptionFactory As Func(Of Exception) = Nothing) As IEnumerable(Of TItem)
